name: release-docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.1.0). Must already exist on origin.'
        required: true
        type: string
      latest:
        description: 'Also tag the image as :latest'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Resolve the git tag: from the manual input on workflow_dispatch,
          # or from the pushed ref on a tag push.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          REPO="ghcr.io/${REPOSITORY}"
          TAGS="${REPO}:${VERSION}"
          # Decide whether to also move :latest. On a manual run, honor the
          # input. On a tag push, move :latest unless this is a prerelease
          # (any version containing '-', e.g. v0.1.0-alpha.1).
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LATEST="$INPUT_LATEST"
          elif [ "${VERSION#*-}" != "$VERSION" ]; then
            LATEST="false"
          else
            LATEST="true"
          fi
          if [ "$LATEST" = "true" ]; then
            TAGS="${TAGS}"$'\n'"${REPO}:latest"
          fi
          {
            echo "tag=${TAG}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
