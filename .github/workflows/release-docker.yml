name: release-docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.1.0). Must already exist on origin.'
        required: true
        type: string
      latest:
        description: 'Also tag the image as :latest'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  # ghcr.io requires a lowercase path; camcima/dev-oidc is already lowercase.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Build each architecture on its OWN native runner. The previous single-job
  # build emulated linux/arm64 through QEMU on an amd64 runner, and Node under
  # QEMU-emulated arm64 intermittently deadlocks — a build that normally takes
  # ~3 minutes would occasionally hang until the 6-hour job timeout. Native
  # arm64 runners remove the emulation entirely, so there is no QEMU step here.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          # Artifact names cannot contain '/', so linux/amd64 -> linux-amd64.
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push each single-platform image by digest (no tag). The digests are
      # stitched into one multi-platform manifest list under the real tags in
      # the merge job below.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-arch digests into a single multi-arch manifest list and
  # publish it under the computed tags (:<version> and, when appropriate,
  # :latest). This is a lightweight metadata-only step — no image build.
  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Resolve the git tag: from the manual input on workflow_dispatch,
          # or from the pushed ref on a tag push.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          REPO="ghcr.io/${REPOSITORY}"
          TAGS="${REPO}:${VERSION}"
          # Decide whether to also move :latest. On a manual run, honor the
          # input. On a tag push, move :latest unless this is a prerelease
          # (any version containing '-', e.g. v0.1.0-alpha.1).
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LATEST="$INPUT_LATEST"
          elif [ "${VERSION#*-}" != "$VERSION" ]; then
            LATEST="false"
          else
            LATEST="true"
          fi
          if [ "$LATEST" = "true" ]; then
            TAGS="${TAGS}"$'\n'"${REPO}:latest"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          VERSION: ${{ steps.tags.outputs.version }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          # One --tag per computed tag; one source ref per per-arch digest.
          tag_args=()
          while IFS= read -r t; do
            [ -n "$t" ] && tag_args+=(--tag "$t")
          done <<< "$TAGS"
          src_refs=()
          for f in *; do
            src_refs+=("${REGISTRY_IMAGE}@sha256:${f}")
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            "${tag_args[@]}" "${src_refs[@]}"

      - name: Inspect
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}"
